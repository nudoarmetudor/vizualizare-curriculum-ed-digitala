<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vizualizator Curriculum — Educație tehnologică și TIC</title>
<style>
:root{
  --bg:#f1f5f9; --panel:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --t:#b45309; --t-bg:#fef3c7; --t-bd:#f59e0b;
  --d:#1d4ed8; --d-bg:#dbeafe; --d-bd:#3b82f6;
  --c-valori:#e11d48; --c-valori-bg:#ffe4e6;
  --c-domenii:#7c3aed; --c-domenii-bg:#ede9fe;
  --c-concepte:#059669; --c-concepte-bg:#d1fae5;
  --c-procese:#0284c7; --c-procese-bg:#e0f2fe;
  --c-aplicative:#d97706; --c-aplicative-bg:#fef3c7;
  --ucomp:#475569; --ucomp-bg:#e2e8f0;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.htop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:700}
.meta{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:6px 14px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.controls{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.controls input[type=search]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;width:280px;font-size:13px}
.toggle{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--border);border-radius:20px;cursor:pointer;user-select:none}
.chk.t{background:var(--t-bg);color:var(--t);border-color:var(--t-bd)}
.chk.d{background:var(--d-bg);color:var(--d);border-color:var(--d-bd)}
.chk.off{opacity:.35;filter:grayscale(.6)}
main{padding:16px}
.view{display:none}
.view.active{display:block}

/* TIMELINE */
.lane-label{font-weight:700;margin:6px 0 8px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:3px}
.dot.t{background:var(--t-bd)} .dot.d{background:var(--d-bd)}
.timeline{display:grid;grid-template-columns:repeat(9,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col-head{position:sticky;top:0;text-align:center;font-weight:700;color:var(--muted);padding:4px;background:var(--bg);border-bottom:2px solid var(--border)}
.cell{display:flex;flex-direction:column;gap:8px;min-height:30px}
.lu-card{border:1px solid var(--border);border-left-width:5px;border-radius:8px;background:#fff;padding:8px 10px;cursor:pointer;transition:.12s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lu-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.10);transform:translateY(-1px)}
.lu-card.t{border-left-color:var(--t-bd)} .lu-card.d{border-left-color:var(--d-bd)}
.lu-code{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
.lu-title{font-weight:600;font-size:12.5px;margin:2px 0 4px;line-height:1.25}
.lu-foot{display:flex;gap:6px;font-size:10.5px;color:var(--muted)}
.pill{background:var(--ucomp-bg);border-radius:10px;padding:1px 7px}

.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px}
.badge.t{background:var(--t-bg);color:var(--t)} .badge.d{background:var(--d-bg);color:var(--d)}
.badge.cls{background:#e2e8f0;color:#334155}

/* GRAPH (Arbore) */
.graph-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.graph-tools button{border:1px solid var(--border);background:#fff;border-radius:6px;min-width:30px;height:28px;cursor:pointer;font-size:14px;padding:0 8px}
.graph-tools button.on{background:var(--text);color:#fff;border-color:var(--text);font-size:12px;font-weight:600}
.glegend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);margin-left:6px;flex-wrap:wrap}
.glegend span{display:inline-flex;align-items:center;gap:4px}
.sq{width:11px;height:11px;border-radius:3px;display:inline-block}
.graph-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff;max-height:80vh}
#gsvg{display:block}
.band-lbl{font-size:11px;fill:#94a3b8;font-weight:700}
.gnode{cursor:pointer}
.gnode text{font-family:ui-monospace,Consolas,monospace;pointer-events:none;user-select:none}
.gnode.dim{opacity:.15}
.edge.hl{stroke-width:2.2}
/* PROGRESIE */
.prog-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.prog-tools button{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.prog-tools button.on{background:var(--text);color:#fff;border-color:var(--text)}
.prog-head{font-size:11px;fill:#64748b;font-weight:700}
.prog-lbl{font-size:11.5px;font-weight:700;fill:#334155}
.prog-sub{font-size:10px;fill:#94a3b8}
.prog-node{cursor:pointer}
.prog-node text{font-family:ui-monospace,monospace;pointer-events:none}
/* DOCUMENT (A4) */
.doc-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.doc-tools button{border:1px solid var(--border);background:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
.doc-tools button.primary{background:#0f172a;color:#fff;border-color:#0f172a}
.doc-tools select{padding:6px 8px;border:1px solid var(--border);border-radius:7px}
.doc-scroll{overflow:auto;max-height:82vh;background:#e9edf2;padding:18px;border-radius:10px}
.sheet{width:210mm;min-height:297mm;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.2);padding:20mm 18mm;box-sizing:border-box;color:#111;font-family:'Georgia','Times New Roman',serif;font-size:11.5pt;line-height:1.5}
.sheet h1.doc-title{font-size:21pt;text-align:center;margin:0 0 3pt}
.sheet .doc-sub{text-align:center;color:#444;margin:0 0 22pt;font-size:12pt}
.sheet h2{font-size:15pt;border-bottom:2px solid #0f172a;padding-bottom:3pt;margin:20pt 0 9pt}
.sheet h3{font-size:13pt;margin:14pt 0 6pt;color:#0f172a}
.sheet p{margin:0 0 8pt;text-align:justify}
.sheet ul,.sheet ol{margin:0 0 8pt 0;padding-left:20pt}
.sheet table.doc{width:100%;border-collapse:collapse;margin:6pt 0;font-size:9.5pt;font-family:'Segoe UI',sans-serif}
.sheet table.doc th,.sheet table.doc td{border:1px solid #94a3b8;padding:4pt 6pt;vertical-align:top;text-align:left}
.sheet table.doc th{background:#e2e8f0}
.sheet table.doc ul{padding-left:14pt;margin:0}
.sheet .lu-block{break-inside:avoid;page-break-inside:avoid;margin:9pt 0 13pt}
.sheet .lu-h{font-weight:700;font-size:11.5pt;margin-bottom:3pt;font-family:'Segoe UI',sans-serif}
.sheet .tagline{font-size:9pt;color:#475569;font-family:'Segoe UI',sans-serif}
.sheet .cls-sec{page-break-before:always}
.sheet small.src{color:#64748b;font-style:italic;font-size:9pt}
@media print{
  header,.doc-tools,#overlay,#panel{display:none !important}
  .view{display:none !important}
  #docview{display:block !important}
  main{padding:0}
  .doc-scroll{overflow:visible;max-height:none;background:#fff;padding:0;border-radius:0}
  .sheet{box-shadow:none;width:auto;min-height:0;margin:0;padding:0}
  @page{size:A4;margin:18mm}
}

/* TABLE */
table{border-collapse:collapse;width:100%;background:#fff;font-size:12.5px}
th,td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
#table th{background:#f8fafc;position:sticky;top:118px;cursor:pointer;white-space:nowrap}
#table th:hover{background:#eef2f7}
tbody tr:hover{background:#f8fafc}
td.code{font-family:ui-monospace,monospace;font-size:11px;white-space:nowrap}
.minibar{display:inline-block;height:6px;border-radius:3px;background:var(--d-bd)}

/* DETAIL PANEL */
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;display:none}
#overlay.open{display:block}
#panel{position:fixed;top:0;right:0;width:min(560px,94vw);height:100%;background:#fff;z-index:50;
  transform:translateX(100%);transition:.2s;overflow-y:auto;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
#panel.open{transform:translateX(0)}
.p-head{padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}
.p-head.t{border-top:5px solid var(--t-bd)} .p-head.d{border-top:5px solid var(--d-bd)}
.p-close{position:absolute;top:12px;right:14px;border:none;background:#f1f5f9;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px}
.p-body{padding:14px 18px}
.sec{margin-bottom:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 7px;border-bottom:1px solid var(--border);padding-bottom:4px}
.chipset{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;border-radius:14px;padding:3px 10px;border:1px solid transparent}
.chip.valori{background:var(--c-valori-bg);color:var(--c-valori)}
.chip.domenii{background:var(--c-domenii-bg);color:var(--c-domenii)}
.chip.concepte{background:var(--c-concepte-bg);color:var(--c-concepte)}
.chip.procese{background:var(--c-procese-bg);color:var(--c-procese)}
.chip.aplicative{background:var(--t-bg);color:var(--t)}
.ucomp-row{margin-bottom:6px}
.ucomp-chip{display:inline-block;font-family:ui-monospace,monospace;font-size:11px;background:var(--ucomp-bg);color:var(--ucomp);border-radius:5px;padding:2px 7px;cursor:help}
.ucon-item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:7px;background:#fcfcfd}
.ucon-name{font-size:12.5px;font-weight:600;margin-bottom:4px}
.derived{font-size:10.5px;color:var(--muted);font-style:italic}
.hint{font-size:11px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>📚 Vizualizator Curriculum — Educație tehnologică și TIC</h1>
    <span class="meta" id="meta"></span>
    <div class="tabs">
      <button class="tab active" data-view="timeline">⏱ Timeline</button>
      <button class="tab" data-view="tree">🌳 Arbore</button>
      <button class="tab" data-view="prog">📈 Progresie</button>
      <button class="tab" data-view="table">▦ Tabel</button>
      <button class="tab" data-view="docview">📄 Document</button>
    </div>
  </div>
  <div class="controls">
    <input type="search" id="search" placeholder="Caută LU, lecție, competență, valoare, concept…">
    <div class="toggle">
      <span class="chk t" data-comp="T">▮ Tehnologic</span>
      <span class="chk d" data-comp="D">▮ Digital</span>
    </div>
    <span class="meta" id="count"></span>
  </div>
</header>
<main>
  <section id="timeline" class="view active"></section>
  <section id="tree" class="view"></section>
  <section id="prog" class="view"></section>
  <section id="table" class="view"></section>
  <section id="docview" class="view"></section>
</main>

<div id="overlay"></div>
<aside id="panel"></aside>

<script src="data.js?v=10"></script>
<script>
const ROMAN={1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII',8:'VIII',9:'IX'};
const C=CURRICULUM, UCOMP=C.ucomp, UCON=C.ucon;
const state={view:'timeline', comp:{T:true,D:true}, q:'', docClass:'all'};
const luById={}; C.lu.forEach(l=>luById[l.cod]=l);
const ucompToLU={}; C.lu.forEach(l=>(l.ucomp||[]).forEach(u=>{(ucompToLU[u]=ucompToLU[u]||[]).push(l.cod)}));
document.getElementById('meta').textContent =
  `${C.meta.nr_cs} CS · ${C.meta.nr_ucomp} UComp · ${C.meta.nr_lu} LU · ${C.meta.nr_ucon} UCon`;

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ucompTitle(code){const u=UCOMP[code];return u?`${code} — ${u.desc}`:code}

function matchLU(l){
  if(!state.comp[l.comp]) return false;
  if(!state.q) return true;
  const q=state.q;
  const hay=[l.cod,l.title,...(l.ucon||[]),...(l.ucomp||[]),
    ...l.valori,...l.domenii,...l.concepte,...l.procese,...l.aplicative,
    ...(l.ucon||[]).map(c=>UCON[c]?UCON[c].name:'')].join(' ').toLowerCase();
  return hay.includes(q);
}
function filtered(){return C.lu.filter(matchLU)}

/* ---------- TIMELINE ---------- */
function renderTimeline(){
  const lus=filtered();
  const el=document.getElementById('timeline'); el.innerHTML='';
  if(!lus.length){el.innerHTML='<p class="meta">Niciun rezultat pentru filtrul curent.</p>';return}
  const legend=document.createElement('div');
  legend.className='lane-label';
  legend.innerHTML=`<span class="dot t"></span>Tehnologic &nbsp;&nbsp;<span class="dot d"></span>Digital &nbsp;·&nbsp; clasele I–IX — ordinea modulelor/scenariilor pe care le poate parcurge un elev`;
  el.appendChild(legend);
  const grid=document.createElement('div'); grid.className='timeline';
  for(let cls=1;cls<=9;cls++){
    const head=document.createElement('div'); head.className='col-head'; head.textContent='Clasa '+ROMAN[cls];
    grid.appendChild(head);
  }
  for(let cls=1;cls<=9;cls++){
    const cell=document.createElement('div'); cell.className='cell';
    lus.filter(l=>l.clasa===cls)
       .sort((a,b)=>a.comp.localeCompare(b.comp)||String(a.ord).localeCompare(String(b.ord),undefined,{numeric:true}))
       .forEach(l=>cell.appendChild(luCard(l)));
    grid.appendChild(cell);
  }
  el.appendChild(grid);
}
function luCard(l){
  const d=document.createElement('div'); d.className='lu-card '+l.comp.toLowerCase();
  d.innerHTML=`<div class="lu-code">${l.cod}${l.comp==='T'?' · modul '+l.ord:' · scenariu '+l.ord}</div>
    <div class="lu-title">${esc(l.title)}</div>
    <div class="lu-foot"><span class="pill">${l.ucon.length} lecții</span><span class="pill">${l.ucomp.length} UComp</span></div>`;
  d.onclick=()=>openPanel(l.cod);
  return d;
}

/* ---------- GRAPH (Arbore node-link) ---------- */
const CSCOL={'1':'#16a34a','2':'#2563eb','3':'#ea580c','4':'#7c3aed'};
function csColor(n){return CSCOL[String(n)]||'#64748b'}
let GW=2800, GH=860, gscale=1;
function gedge(a,b,col,op,from,to){const my=((a.y+b.y)/2).toFixed(1);
  return `<path class="edge" data-a="${from}" data-b="${to}" data-op="${op}" d="M${a.x.toFixed(1)},${a.y} C${a.x.toFixed(1)},${my} ${b.x.toFixed(1)},${my} ${b.x.toFixed(1)},${b.y}" stroke="${col}" stroke-width="1" fill="none" opacity="${op}"/>`}
function gbox(cx,cy,w,h,id,label,fill,stroke,tcol,fs,tip,lu){
  const x=(cx-w/2).toFixed(1),y=(cy-h/2).toFixed(1);
  return `<g class="gnode${lu?' lu':''}" data-id="${id}" transform="translate(${x},${y})"><title>${esc(tip)}</title>`+
    `<rect width="${w}" height="${h}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="${lu?2:1.5}"/>`+
    `<text x="${w/2}" y="${(h/2+3.5).toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="${lu?600:700}" fill="${tcol}">${label}</text></g>`;
}
// Ramurile de competență (CS + subramură sub) — aceeași grupare ca la Progresie/Competențe,
// ~21 ramuri agregate pe toți cei 9 ani, în loc de 69 de casete UComp risipite.
function competenceBranches(){
  const g={};
  Object.values(UCOMP).forEach(u=>{const pp=u.cod.split('.');const y=pp[1],z=pp[2],w=+pp[3];
    const key=y+'|'+z;(g[key]=g[key]||{cs:y,z:z,nodes:[]}).nodes.push({clasa:w,cod:u.cod,desc:u.desc})});
  const arr=Object.values(g);
  arr.forEach(b=>b.nodes.sort((a,b2)=>a.clasa-b2.clasa));
  arr.sort((a,b)=>a.cs.localeCompare(b.cs)||a.z.localeCompare(b.z,undefined,{numeric:true}));
  return arr;
}
let graphSpine='aggregated'; // 'aggregated' (o casetă/ramură) | 'expanded' (+ indicator vizual pe ani)
function setGraphSpine(m){graphSpine=m;renderGraph();}
function luBoxHtml(l,cx,cy,w,h){
  const x=(cx-w/2).toFixed(1),y=(cy-h/2).toFixed(1),col=l.comp==='T'?'#f59e0b':'#3b82f6';
  const t=l.title.length>27?l.title.slice(0,27)+'…':l.title;
  return `<g class="gnode lu" data-id="${l.cod}" transform="translate(${x},${y})"><title>${esc(l.cod+' — '+l.title)}</title>
    <rect width="${w}" height="${h}" rx="6" fill="#fff" stroke="${col}" stroke-width="2"/>
    <text x="8" y="15" font-size="9" font-weight="700" fill="${col}" font-family="ui-monospace,Consolas,monospace">${esc(l.cod)}</text>
    <text x="8" y="28" font-size="8.3" fill="#334155">${esc(t)}</text>
    <text x="8" y="${h-8}" font-size="7.3" fill="#94a3b8">${l.ucon.length} lecții · ${l.ucomp.length} UComp</text></g>`;
}
function renderGraph(){
  const lus=filtered();
  const el=document.getElementById('tree'); el.innerHTML='';
  if(!lus.length){el.innerHTML='<p class="meta">Niciun rezultat.</p>';return}
  const expanded=graphSpine==='expanded';
  const branches=competenceBranches();
  const branchKey=b=>b.cs+'|'+b.z, branchId=b=>'BR.'+b.cs+'.'+b.z;
  // --- coloana-șira din stânga: ramurile de competență, câte o casetă/ramură ---
  const SPINE_W=expanded?300:236, ROWH=expanded?48:32, SPINE_TOP=54;
  const bY={}; branches.forEach((b,i)=>bY[branchKey(b)]=SPINE_TOP+i*ROWH+ROWH/2);
  const spineH=SPINE_TOP+branches.length*ROWH+20;
  // --- coloane pe clasă (I-IX), LU stivuite vertical în fiecare, ca la Timeline ---
  const COLW=182, CARD_W=160, CARD_H=58, CARD_GAP=8, GRID_X0=SPINE_W+30, COL_TOP=54;
  const byClass={}; for(let c=1;c<=9;c++)byClass[c]=lus.filter(l=>l.clasa===c)
    .sort((a,b)=>a.comp.localeCompare(b.comp)||String(a.ord).localeCompare(String(b.ord),undefined,{numeric:true}));
  const colX=c=>GRID_X0+(c-1)*COLW;
  const pos={}; let maxColBottom=0;
  for(let c=1;c<=9;c++){let y=COL_TOP;
    byClass[c].forEach(l=>{pos[l.cod]={x:colX(c)+CARD_W/2,y:y+CARD_H/2};y+=CARD_H+CARD_GAP});
    maxColBottom=Math.max(maxColBottom,y+10);
  }
  GH=Math.max(spineH,maxColBottom)+16; GW=colX(9)+COLW;
  // fundal coloane + cap de clasă + linie despărțitoare șiră/grilă
  let bands=`<line x1="${SPINE_W+14}" y1="0" x2="${SPINE_W+14}" y2="${GH}" stroke="#dbe2ea" stroke-width="2"/>`;
  for(let c=1;c<=9;c++){const x=colX(c);
    bands+=`<rect x="${x-10}" y="26" width="${COLW}" height="${GH-36}" fill="${c%2?'#ffffff':'#f6f8fb'}"/>`+
      `<text x="${x+CARD_W/2}" y="20" text-anchor="middle" class="band-lbl">Clasa ${ROMAN[c]}</text>`}
  // muchii: fiecare LU -> ramurile de competență pe care le folosește
  let edges='';
  lus.forEach(l=>{const a=pos[l.cod];if(!a)return;
    l.ucomp.forEach(uc=>{const pp=uc.split('.');const key=pp[1]+'|'+pp[2];const by=bY[key];if(by===undefined)return;
      edges+=gedge({x:SPINE_W+14,y:by},a,l.comp==='T'?'#f59e0b':'#3b82f6',0.16,branchId({cs:pp[1],z:pp[2]}),l.cod)});
  });
  // noduri șiră
  let spineNodes='';
  branches.forEach(b=>{const y=bY[branchKey(b)],col=csColor(b.cs),cls=b.nodes.map(n=>n.clasa);
    const tip=`CS${b.cs} · ramura UC${b.z} — apare la clasele ${cls.map(w=>ROMAN[w]).join(', ')}. Clic = firul complet pe ani.`;
    spineNodes+=gbox(SPINE_W/2-2,y,SPINE_W-22,expanded?24:26,branchId(b),'CS'+b.cs+'·UC'+b.z,'#fff',col,col,10,tip,false);
    if(expanded){const dotW=(SPINE_W-38)/9; let dots='';
      for(let c=1;c<=9;c++){const has=cls.includes(c);dots+=`<rect x="${(c-1)*dotW}" width="${dotW-2}" height="10" rx="2" fill="${has?col:'#e2e8f0'}"/>`}
      spineNodes+=`<g transform="translate(16,${(y+15).toFixed(1)})" pointer-events="none">${dots}</g>`;
    }
  });
  // noduri LU (o coloană = o clasă, stivuite vertical, fără împrăștiere orizontală)

function graphBranchFocus(cs,z){

  const chip=x=>`<span class="ucomp-chip" onclick="progFocus('ucomp','${x.cod}')" style="cursor:pointer" title="${esc(x.desc)}">${x.cod.replace('UComp.','')} · cl.${ROMAN[+x.cod.split('.')[3]]}</span>`;

    <div class="p-head"><button class="p-close" onclick="closePanel()">✕</button>

        <div class="hint" style="margin-top:6px">Apare la clasele: ${line.map(x=>ROMAN[+x.cod.split('.')[3]]).join(', ')}.</div>
      </div>
    </div>`;

}
function hl(id){const svg=document.getElementById('gsvg');const conn=new Set([id]);
  svg.querySelectorAll('.edge').forEach(ed=>{const on=ed.dataset.a===id||ed.dataset.b===id;
    ed.classList.toggle('hl',on);ed.style.opacity=on?0.95:0.03;if(ed.dataset.a===id)conn.add(ed.dataset.b);if(ed.dataset.b===id)conn.add(ed.dataset.a)});
  svg.querySelectorAll('.gnode').forEach(n=>n.classList.toggle('dim',!conn.has(n.dataset.id)));}
function clearHl(){const svg=document.getElementById('gsvg');
  svg.querySelectorAll('.edge').forEach(ed=>{ed.classList.remove('hl');ed.style.opacity=ed.dataset.op});
  svg.querySelectorAll('.gnode').forEach(n=>n.classList.remove('dim'));}
function applyZoom(){const s=document.getElementById('gsvg');if(s){s.setAttribute('width',(GW*gscale).toFixed(0));s.setAttribute('height',(GH*gscale).toFixed(0))}}
function zoomG(f){gscale=Math.max(0.25,Math.min(2.5,gscale*f));applyZoom()}
function zoomFit(){const w=document.getElementById('gwrap');if(!w)return;gscale=Math.max(0.25,Math.min(1.4,(w.clientWidth-4)/GW));applyZoom()}

function chipset(arr,cls){if(!arr||!arr.length)return '<span class="hint">—</span>';
  return '<div class="chipset">'+arr.map(t=>`<span class="chip ${cls}">${esc(t)}</span>`).join('')+'</div>'}
// Structura unificată "Unități de conținut" (Document + panou), conform Șablonului:
// Concepte/procese combinate, Aplicative, Context practic, Interdisciplinare, Noile educații,
// Teme cross-curriculare, Terminologie specifică (= aceiași termeni ca Concepte — decizie de design,
// vezi MASTER.md §7), Domenii de acțiune.
function luContentBlocks(l){
  const blocks=[];
  const cp=[...(l.concepte||[]),...(l.procese||[])];
  if(cp.length) blocks.push(['Concepte, procese și relații',cp]);
  if(l.aplicative&&l.aplicative.length) blocks.push(['Conținuturi aplicative',l.aplicative]);
  if(l.context_practic&&l.context_practic.length) blocks.push(['Context de învățare practică (învățare experiențială)',l.context_practic]);
  if(l.interdisciplinare&&l.interdisciplinare.length) blocks.push(['Conținuturi interdisciplinare',l.interdisciplinare]);
  if(l.noile_educatii&&l.noile_educatii.length) blocks.push(['Noile educații',l.noile_educatii]);
  if(l.teme_cross&&l.teme_cross.length) blocks.push(['Teme cross-curriculare',l.teme_cross]);
  if(l.concepte&&l.concepte.length) blocks.push(['Terminologie specifică',l.concepte]);
  if(l.domenii&&l.domenii.length) blocks.push(['Domenii de acțiune',l.domenii]);
  return blocks;
}
const LONGFORM_BLOCKS=new Set(['Context de învățare practică (învățare experiențială)','Conținuturi interdisciplinare','Noile educații','Teme cross-curriculare']);
function openPanel(cod){
  const l=luById[cod]; if(!l)return;

    uconList+=`<div class="ucon-item"><div class="ucon-name">📄 ${esc(u.name)}</div><div>${tags||''}</div></div>`});
  const rezList=(l.rezultate&&l.rezultate.length)?'<ul style="margin:0;padding-left:18px">'+l.rezultate.map(x=>`<li style="margin-bottom:4px;font-size:12.5px">${esc(x)}</li>`).join('')+'</ul>':'';
  p.className='open'; p.innerHTML=`
   <div class="p-head ${l.comp.toLowerCase()}">
     <button class="p-close" onclick="closePanel()">✕</button>
     <div class="lu-code">${l.cod} · Clasa ${ROMAN[l.clasa]} · <span class="badge ${l.comp.toLowerCase()}">${l.comp==='T'?'Tehnologic':'Digital'}</span></div>
     <h2 style="margin:6px 0 0;font-size:17px">${esc(l.title)}</h2>
     <div class="hint">${l.comp==='T'?'Modul opțional '+l.ord:'Scenariu '+l.ord} · ${l.ucon.length} lecții · ${l.ucomp.length} unități de competență</div>
   </div>
   <div class="p-body">
     ${l.valori&&l.valori.length?`<div class="sec"><h3>Valori promovate</h3>${chipset(l.valori,'valori')}</div>`:''}
     <div class="sec"><h3>Unități de competență</h3>${ucHtml}</div>
     <div class="sec"><h3>Unități de conținut (lecții)</h3>${uconList||'—'}<div class="hint" style="margin-top:6px">Fiecare lecție arată competențele pe care le dezvoltă (tag-uri). Hover = descriere.</div></div>
     ${rezList?`<div class="sec"><h3>Rezultate ale învățării</h3><div class="hint" style="margin-bottom:6px">Elevul/eleva:</div>${rezList}</div>`:''}
     ${cont}
   </div>`;
  document.getElementById('overlay').className='open';
}

];

let progMode='competente';
function setProgMode(m){progMode=m;renderProg();}
function renderProg(){
  const el=document.getElementById('prog');
  let lines=[];
  const isDomenii=progMode==='domenii';
  if(progMode==='domenii'){
    // Domenii de acțiune, combinate într-o singură fereastră: D = DigComp 3.0 (5 arii -> 21 sub-competențe),
    // T = taxonomie proprie (6 domenii, o singură "arie" umbrelă). Comutatorul ▮ Tehnologic / ▮ Digital din
    // antet decide ce se afișează aici — nu mai există butoane separate per componentă.
    if(state.comp.D) DIGCOMP.forEach(sc=>{
      const key=sc.code+' '+sc.name;
      const nodes=[];
      C.lu.filter(l=>l.comp==='D' && l.domenii && l.domenii.includes(key)).forEach(l=>{
        nodes.push({clasa:l.clasa,id:l.cod,label:l.cod,title:l.title,kind:'lu'});
      });
      nodes.sort((a,b)=>a.clasa-b.clasa);
      lines.push({area:sc.area,areaName:sc.areaName,code:sc.code,label:sc.name,color:AREACOL[sc.area],nodes});
    });
    if(state.comp.T) TDOM.forEach(td=>{
      const key=td.code+' '+td.name;
      const nodes=[];
      C.lu.filter(l=>l.comp==='T' && l.domenii && l.domenii.includes(key)).forEach(l=>{
        nodes.push({clasa:l.clasa,id:l.cod,label:l.cod,title:l.title,kind:'lu'});
      });
      nodes.sort((a,b)=>a.clasa-b.clasa);
      lines.push({area:'T',areaName:'Educație tehnologică · domenii proprii (nu DigComp)',code:td.code,label:td.name,color:TDOMCOL[td.code],nodes});
    });
    if(state.q)lines=lines.filter(L=>L.label.toLowerCase().includes(state.q)||L.areaName.toLowerCase().includes(state.q)||L.nodes.some(n=>(n.id+' '+n.title).toLowerCase().includes(state.q)));
  } else if(progMode==='competente'){
    // Grupare pe (CS, ramură) INDIFERENT de ciclu — firul continuă peste granița primar/gimnaziu
    // acolo unde ramura chiar există; unde nu există la o clasă, pur și simplu nu apare nod acolo
    // (iar conectorul dintre noduri neconsecutive e desenat punctat, ca discontinuitatea să fie vizibilă).
    const groups={};
    Object.values(UCOMP).forEach(u=>{const pp=u.cod.split('.');const y=pp[1],z=pp[2],w=+pp[3];
      const key=y+'|'+z;(groups[key]=groups[key]||{cs:y,z:z,nodes:[]}).nodes.push({clasa:w,id:u.cod,title:u.desc,cyc:w<=4?'primar':'gimnaziu'})});
    Object.values(groups).forEach(g=>{g.nodes.sort((a,b)=>a.clasa-b.clasa);
      const spanPrimar=g.nodes.some(n=>n.cyc==='primar'), spanGimnaziu=g.nodes.some(n=>n.cyc==='gimnaziu');
      const sub=spanPrimar&&spanGimnaziu?'I–IX':(spanPrimar?'I–IV':'V–IX');
      lines.push({cs:g.cs,z:+g.z,label:`CS${g.cs} · UC${g.z}`,sub,color:csColor(g.cs),
        nodes:g.nodes.map(n=>({clasa:n.clasa,id:n.id,label:n.id.replace('UComp.',''),title:n.title,kind:'ucomp'}))})});
    lines.sort((a,b)=>a.cs.localeCompare(b.cs)||a.z-b.z);
    if(state.q)lines=lines.filter(L=>L.label.toLowerCase().includes(state.q)||L.nodes.some(n=>(n.id+' '+n.title).toLowerCase().includes(state.q)));
  } else {
    // T: grupare pe titlul modulului (recurent peste clase). D: grupare pe domeniu de acțiune
    // (titlurile D nu se repetă între clase, deci gruparea pe titlu nu arată progresie — pe domeniu, da).
    const groups={};
    C.lu.filter(l=>state.comp[l.comp]).forEach(l=>{
      if(l.comp==='D' && l.domenii && l.domenii.length){
        l.domenii.forEach(dom=>{const key='D||'+dom;(groups[key]=groups[key]||{comp:'D',title:dom,nodes:[]}).nodes.push(l)});
      } else {
        const key=l.comp+'||'+l.title;(groups[key]=groups[key]||{comp:l.comp,title:l.title,nodes:[]}).nodes.push(l);
      }
    });
    Object.values(groups).forEach(g=>{g.nodes.sort((a,b)=>a.clasa-b.clasa);
      lines.push({comp:g.comp,label:g.title,sub:g.comp==='T'?'Tehnologic · modul':'Digital · domeniu de acțiune',color:g.comp==='T'?'#f59e0b':'#3b82f6',
        nodes:g.nodes.map(l=>({clasa:l.clasa,id:l.cod,label:l.cod,title:l.title,kind:'lu'}))})});
    lines.sort((a,b)=>a.sub.localeCompare(b.sub)||a.label.localeCompare(b.label));
    if(state.q)lines=lines.filter(L=>L.label.toLowerCase().includes(state.q)||L.nodes.some(n=>(n.id+' '+n.title).toLowerCase().includes(state.q)));
  }
  const AREA_W=170,SUB_W=165;
  const LBL=isDomenii?AREA_W+SUB_W:235,COLW=126,ROWH=isDomenii?40:52,TOP=42,W=LBL+9*COLW,H=TOP+lines.length*ROWH+20;
  const cx=c=>LBL+(c-0.5)*COLW;
  let head=''; for(let c=1;c<=9;c++)head+=`<text x="${cx(c)}" y="26" text-anchor="middle" class="prog-head">Clasa ${ROMAN[c]}</text>`;
  let grid=''; for(let c=0;c<=9;c++){const x=LBL+c*COLW;grid+=`<line x1="${x}" y1="32" x2="${x}" y2="${H-10}" stroke="#eef2f7"/>`}
  // coloana Arie (stânga) — bloc unic, centrat vertical, pentru fiecare grup contiguu de rânduri cu aceeași arie
  let areaBlocks='';
  if(isDomenii){
    let idx=0;
    while(idx<lines.length){
      let j=idx; while(j<lines.length && lines[j].area===lines[idx].area) j++;
      const y0=TOP+idx*ROWH, y1=TOP+j*ROWH, yc=(y0+y1)/2, col=AREACOL[lines[idx].area];
      areaBlocks+=`<rect x="0" y="${y0}" width="${AREA_W}" height="${y1-y0}" fill="${col}" opacity="0.08"/><rect x="0" y="${y0}" width="4" height="${y1-y0}" fill="${col}"/>`;
      const words=lines[idx].areaName.split(' '); let ln='',lns=[];
      words.forEach(w=>{if((ln+' '+w).trim().length>20){lns.push(ln.trim());ln=w}else ln=(ln+' '+w).trim()});
      if(ln)lns.push(ln.trim());
      lns.forEach((t,k)=>{areaBlocks+=`<text x="14" y="${(yc-((lns.length-1)*6)+k*12).toFixed(1)}" font-size="10.5" font-weight="700" fill="${col}">${esc(t)}</text>`});
      idx=j;
    }
  }

function progFocus(kind,id){

      <h2 style="margin:6px 0 0;font-size:16px">${esc(u.desc)}</h2></div>

      <div class="sec"><h3>⬅ Pre-rechizite (Expects)</h3>${prev.length?'<div class="chipset">'+prev.map(chip).join('')+'</div><div class="hint">Tot ce trebuie format înainte — clasele anterioare din același fir de competență.</div>':'<span class="hint">Niciuna — acesta este punctul de pornire al firului.</span>'}</div>
      <div class="sec"><h3>➡ Necesară pentru (Expected By)</h3>${next.length?'<div class="chipset">'+next.map(chip).join('')+'</div>':'<span class="hint">Niciuna — finalul firului (clasa terminală).</span>'}</div>

/* ---------- EXPORT DOCX (generator minimal, fără dependințe externe) ---------- */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function u16(n){return [n&0xFF,(n>>8)&0xFF]}
function u32(n){return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>>24)&0xFF]}
function makeZip(files){
  let offset=0; const localParts=[],centralParts=[];
  files.forEach(f=>{
    const nameBytes=Array.from(new TextEncoder().encode(f.name));
    const crc=crc32(f.data), size=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),
      ...u32(crc),...u32(size),...u32(size),...u16(nameBytes.length),...u16(0),...nameBytes]);
    localParts.push(lh,f.data);
    const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),
      ...u32(crc),...u32(size),...u32(size),...u16(nameBytes.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nameBytes]);
    centralParts.push(ch);
    offset+=lh.length+size;
  });
  const centralOffset=offset, centralSize=centralParts.reduce((s,p)=>s+p.length,0);
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
    ...u32(centralSize),...u32(centralOffset),...u16(0)]);
  const all=[...localParts,...centralParts,eocd];
  const total=all.reduce((s,p)=>s+p.length,0);
  const out=new Uint8Array(total); let pos=0; all.forEach(p=>{out.set(p,pos);pos+=p.length});
  return out;
}
function xmlEsc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function runXml(text,bold){if(!text)return '';return `<w:r>${bold?'<w:rPr><w:b/></w:rPr>':''}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`}
function inlineRuns(node,bold){
  let out=''; (node.childNodes||[]).forEach(ch=>{
    if(ch.nodeType===3) out+=runXml(ch.textContent,bold);
    else if(ch.nodeType===1){const tag=ch.tagName.toLowerCase();
      if(tag==='strong'||tag==='b') out+=inlineRuns(ch,true);
      else if(tag==='br') out+='<w:br/>';
      else out+=inlineRuns(ch,bold);
    }});
  return out;
}
function paraXml(runsXml,opts){opts=opts||{};const props=[];
  if(opts.align) props.push(`<w:jc w:val="${opts.align}"/>`);
  if(opts.spacing) props.push(`<w:spacing w:before="${opts.spacing[0]||0}" w:after="${opts.spacing[1]||0}"/>`);
  return `<w:p>${props.length?'<w:pPr>'+props.join('')+'</w:pPr>':''}${runsXml||''}</w:p>`;
}
function headingXml(text,size,opts){opts=opts||{};
  return `<w:p><w:pPr>${opts.align?`<w:jc w:val="${opts.align}"/>`:''}<w:spacing w:before="240" w:after="120"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}
function tableXml(tableEl){
  const rows=[...tableEl.querySelectorAll(':scope > thead > tr, :scope > tbody > tr')];
  let trs='';
  rows.forEach(tr=>{
    let tcs='';
    [...tr.children].forEach(td=>{
      const isHeader=td.tagName.toLowerCase()==='th';
      const colspan=parseInt(td.getAttribute('colspan')||'1',10);
      const gridSpan=colspan>1?`<w:gridSpan w:val="${colspan}"/>`:'';
      const shade=isHeader?'<w:shd w:val="clear" w:fill="E2E8F0"/>':'';
      let cellBody='';
      const hasList=td.querySelector(':scope > ul, :scope > ol');
      if(hasList){
        td.childNodes.forEach(ch=>{
          if(ch.nodeType===1&&(ch.tagName==='UL'||ch.tagName==='OL')){
            [...ch.children].forEach(li=>{cellBody+=paraXml(runXml('• ',isHeader)+inlineRuns(li,isHeader))});
          } else if(ch.nodeType===1||(ch.nodeType===3&&ch.textContent.trim())){
            cellBody+=paraXml(inlineRuns({childNodes:[ch]},isHeader));
          }
        });
      } else {
        cellBody=paraXml(inlineRuns(td,isHeader));
      }
      if(!cellBody) cellBody=paraXml('');
      tcs+=`<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>${gridSpan}${shade}</w:tcPr>${cellBody}</w:tc>`;
    });
    trs+=`<w:tr>${tcs}</w:tr>`;
  });
  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders><w:top w:val="single" w:sz="4" w:color="94A3B8"/><w:left w:val="single" w:sz="4" w:color="94A3B8"/><w:bottom w:val="single" w:sz="4" w:color="94A3B8"/><w:right w:val="single" w:sz="4" w:color="94A3B8"/><w:insideH w:val="single" w:sz="4" w:color="94A3B8"/><w:insideV w:val="single" w:sz="4" w:color="94A3B8"/></w:tblBorders></w:tblPr>${trs}</w:tbl>`;
}
function blockWalk(el){
  let xml='';
  el.childNodes.forEach(ch=>{
    if(ch.nodeType!==1) return;
    const tag=ch.tagName.toLowerCase(), cls=ch.className||'';
    if(tag==='h1') xml+=headingXml(ch.textContent.trim(),36,{align:'center'});
    else if(tag==='h2') xml+=headingXml(ch.textContent.trim(),28);
    else if(tag==='h3') xml+=headingXml(ch.textContent.trim(),24);
    else if(tag==='p') xml+=paraXml(inlineRuns(ch,false),{align:cls.includes('doc-sub')?'center':undefined,spacing:[0,120]});
    else if(tag==='ul'||tag==='ol') [...ch.children].forEach((li,idx)=>{xml+=paraXml(runXml(tag==='ol'?(idx+1)+'. ':'• ',false)+inlineRuns(li,false))});
    else if(tag==='table') xml+=tableXml(ch);
    else if(tag==='small') xml+=paraXml(inlineRuns(ch,false));
    else xml+=blockWalk(ch);
  });
  return xml;
}
function exportDocx(){
  const sheet=document.querySelector('.sheet');
  if(!sheet){alert('Deschide întâi tab-ul Document.');return}
  const bodyXml=blockWalk(sheet);
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n`+
    `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">`+
    `<w:body>${bodyXml}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417"/></w:sectPr></w:body></w:document>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n`+
    `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n`+
    `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n`+
    `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
  const enc=s=>new TextEncoder().encode(s);
  const files=[
    {name:'[Content_Types].xml',data:enc(contentTypes)},
    {name:'_rels/.rels',data:enc(rels)},
    {name:'word/document.xml',data:enc(documentXml)},
    {name:'word/_rels/document.xml.rels',data:enc(docRels)},
  ];
  const zipBytes=makeZip(files);
  const blob=new Blob([zipBytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  const clsTag=state.docClass&&state.docClass!=='all'?'clasa-'+state.docClass:'integral';
  a.download=`curriculum-${clsTag}.docx`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function rerender(){
  document.getElementById('count').textContent=filtered().length+' LU afișate';
  if(state.view==='timeline')renderTimeline();
  else if(state.view==='tree')renderGraph();
  else if(state.view==='prog')renderProg();
  else if(state.view==='docview')renderDoc();
  else renderTable();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); state.view=t.dataset.view;
  document.getElementById(state.view).classList.add('active'); rerender();
});
document.querySelectorAll('.chk').forEach(c=>c.onclick=()=>{
  const k=c.dataset.comp; state.comp[k]=!state.comp[k];
  c.classList.toggle('off',!state.comp[k]); rerender();
});
document.getElementById('search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();rerender()};
rerender();
</script>
</body>
</html>
